<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC2026</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, var(--bg2), var(--bg));
      color: var(--text);
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 560px;
    }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 999px;
      padding: 6px 16px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin-top: 20px;
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.6;
    }
    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Coming soon</span>
    <h1>MC2026</h1>
    <p>This site is under construction. Check back soon for updates.</p>
    <footer>&copy; 2026 MC2026</footer>
  </main>
</body>
</html>
